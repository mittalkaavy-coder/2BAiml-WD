<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Criteria</title>
    <script>
      function sum() {
        let age = parseInt(prompt("Enter value of a: "));
        if (age >= 18) {
          let c = confirm("Do you want to submmit your response");
          if (c) {
            alert("Your response is submitted");
            alert("Your are eligible to vote");
          } else {
            alert("Thank You!");
          }
        } else {
          alert("You are not eligible");
        }
      }
    </script>
  </head>
  <body>
    <input type="button" onclick="sum()" value="Result" />
  </body>
</html>

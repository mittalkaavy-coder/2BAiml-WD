<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Criteria</title>
    <script>
      function sum() {
        let age = parseInt(prompt("Enter value of a: "));
        if (age >= 18) {
          alert("You are eligible for voting");
        } else {
          alert("You are not eligible");
        }
      }
    </script>
  </head>
  <body>
    <input type="button" onclick="sum()" value="Result" />
  </body>
</html>

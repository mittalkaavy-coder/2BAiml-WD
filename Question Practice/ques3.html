<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee and Manager Payroll System</title>
  </head>
  <body>
    <script>
      class Employee {
        constructor(id, name, basicSalary) {
          this.id = id;
          this.name = name;
          this.basicSalary = basicSalary;
        }
        calculateSalary() {
          return this.basicSalary;
        }
      }
      class Manager extends Employee {
        constructor(id, name, basicSalary, incentive) {
          super(id, name, basicSalary);
          this.incentive = incentive;
        }
        calculateSalary() {
          return this.basicSalary + this.incentive;
        }
      }
      let emp1 = new Employee(101, "Max", 50000);
      let emp2 = new Manager(102, "Kartik", 60000, 10000);

      console.log(`Employee Salary: ${emp1.calculateSalary()}`);
      console.log(`Manager Salary: ${emp2.calculateSalary()}`);
    </script>
  </body>
</html>

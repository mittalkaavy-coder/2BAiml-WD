<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spread Operator</title>
    <script>
      function sum(...values) {
        let sum = 0;
        for (let i in values) {
          sum += values[i];
        }
        console.log(sum);
      }
      let ar = [10, 20, 30, 40];
      sum(...ar);

      var a1 = [10, 20, 30];
      var a2 = [40, 50];

      var a3 = a1.concat(a2);
      console.log(a3);

      var a3 = [a1, ...a2];
      var a3 = [60, a1, 70, a2];
      console.log(a3);
    </script>
  </head>
  <body>
    heheheheheheheheh
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spread Operator</title>
    <script>
      function sum(...values) {
        let sum = 0;
        for (let i in values) {
          sum += values[i];
        }
        console.log(sum);
      }
      let ar = [10, 20, 30, 40];
      sum(...ar);
    </script>
  </head>
